<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebDAV 网盘音乐播放器</title>
    <link rel="stylesheet" href="style.css">
    <!-- 引入 WebDAV 客户端库 -->
    <script src="https://cdn.jsdelivr.net/npm/webdav@5.3.0/dist/webdav.min.js"></script>
</head>
<body>
    <div class="player-container">
        <h2>WebDAV 音乐播放器</h2>
        
        <!-- 配置区域 -->
        <div id="config-panel" class="panel">
            <input type="text" id="dav-url" placeholder="WebDAV 地址 (例如: https://dav.123pan.com)" />
            <input type="text" id="dav-username" placeholder="用户名/账号" />
            <input type="password" id="dav-password" placeholder="密码" />
            <button id="connect-btn">连接网盘</button>
        </div>

        <!-- 播放器主界面 -->
        <div id="main-panel" class="panel hidden">
            <div class="music-info">
                <p id="current-song">当前未播放音乐</p>
            </div>
            
            <!-- 核心音频标签 -->
            <audio id="audio-player" controls></audio>

            <!-- 音乐列表 -->
            <div class="playlist-container">
                <h3>音乐列表</h3>
                <ul id="playlist"></ul>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
